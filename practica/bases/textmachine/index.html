<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efecto Máquina de Escribir Minimalista</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a192f;
            font-family: 'Segoe UI', sans-serif;
        }
        
        .container {
            position: relative;
            width: 400px;
            height: 300px;
        }
        
        .image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .image:hover {
            transform: scale(1.03);
        }
        
        .text-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 0 0 8px 8px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            min-height: 80px;
            display: flex;
            align-items: center;
            font-size: 18px;
            line-height: 1.5;
        }
        
        .typed-cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background: #64ffda;
            margin-left: 3px;
            animation: blink 0.7s infinite;
            vertical-align: bottom;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1579546929662-711aa81148cf?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
             alt="Imagen decorativa" class="image" id="image">
        <div class="text-container" id="textContainer">
            <div id="progressText"></div>
            <span class="typed-cursor"></span>
        </div>
    </div>

    <script>
        // Seleccionar elementos
        const image = document.getElementById('image');
        const textContainer = document.getElementById('textContainer');
        const progressText = document.getElementById('progressText');
        
        // Texto a mostrar
        const textToType = "Este texto aparece con efecto de máquina de escribir cuando pasas el cursor sobre la imagen...";
        
        // Variables de control
        let typingInterval;
        let currentIndex = 0;
        
        // Función que escribe un carácter a la vez
        function typeWriter() {
            if (currentIndex < textToType.length) {
                progressText.textContent += textToType.charAt(currentIndex);
                currentIndex++;
            } else {
                clearInterval(typingInterval);
            }
        }
        
        // Evento al pasar el cursor sobre la imagen
        image.addEventListener('mouseenter', () => {
            // Reiniciar variables
            currentIndex = 0;
            progressText.textContent = "";
            
            // Mostrar contenedor de texto
            textContainer.style.opacity = "1";
            textContainer.style.transform = "translateY(0)";
            
            // Iniciar efecto máquina de escribir
            typingInterval = setInterval(typeWriter, 50);
        });
        
        // Evento al quitar el cursor de la imagen
        image.addEventListener('mouseleave', () => {
            // Detener animación
            clearInterval(typingInterval);
            
            // Ocultar contenedor de texto
            textContainer.style.opacity = "0";
            textContainer.style.transform = "translateY(20px)";
        });
    </script>
</body>
</html>
