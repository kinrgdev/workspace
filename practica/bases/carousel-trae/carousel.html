<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Carousel de Imagenes" />
    <meta name="author" content="kinrgdev" />
    <meta name="keywords" content="carousel, html, css, JavaScript, Google Material Icons, pexels, diseño web">
    <meta name="theme-color" content="#fff">
    <link rel="stylesheet" href="style.css">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Carrusel de Imágenes</title>
</head>
<body>
    
    <div class="carousel-wrapper">
        
        <!-- Contenedor principal del carrusel -->
        <div id="carousel">
            <!-- Contenedor de slides -->
            <div id="carousel-container">
                <!-- Slide 1 -->
                <div class="slide">
                    <img src="https://images.pexels.com/photos/2662116/pexels-photo-2662116.jpeg" alt="Imagen 1">
                </div>
                <!-- Slide 2 -->
                <div class="slide">
                    <img src="https://images.pexels.com/photos/1366919/pexels-photo-1366919.jpeg" alt="Imagen 2">
                </div>
                <!-- Slide 3 -->
                <div class="slide">
                    <img src="https://images.pexels.com/photos/1287145/pexels-photo-1287145.jpeg" alt="Imagen 3">
                </div>
                <!-- Slide 4 -->
                <div class="slide">
                    <img src="https://images.pexels.com/photos/2559941/pexels-photo-2559941.jpeg" alt="Imagen 4">
                </div>
            </div>
            
            <!-- Botones de navegación con Google Material Icons -->
            <button id="prev-button">
                <i class="material-icons">navigate_before</i>
            </button>
            <button id="next-button">
                <i class="material-icons">navigate_next</i>
            </button>
            
            <!-- Indicador de progreso -->
        </div>
        <div id="carousel-progress">
            <!-- Los indicadores se generarán dinámicamente con JavaScript -->
        </div>
    </div>
    
    <!-- Script del carrusel -->
    <script src="carousel.js"></script>
</body>
</html>
