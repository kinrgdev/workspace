<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de Imágenes</title>
    <!-- Tailwind CSS CDN (última versión) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    
    <div class="max-w-4xl w-full mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <h1 class="text-2xl font-bold text-center py-4 bg-gradient-to-r from-blue-500 to-purple-500 text-white">Carrusel de Imágenes</h1>
        
        <!-- Contenedor principal del carrusel -->
        <div id="carousel" class="relative overflow-hidden w-full h-[500px]">
            <!-- Contenedor de slides -->
            <div id="carousel-container" class="flex h-full transition-transform duration-500 ease-in-out">
                <!-- Slide 1 -->
                <div class="flex-none w-full">
                    <img src="https://images.pexels.com/photos/2662116/pexels-photo-2662116.jpeg" alt="Imagen 1" class="w-full h-full object-cover">
                </div>
                <!-- Slide 2 -->
                <div class="flex-none w-full">
                    <img src="https://images.pexels.com/photos/1366919/pexels-photo-1366919.jpeg" alt="Imagen 2" class="w-full h-full object-cover">
                </div>
                <!-- Slide 3 -->
                <div class="flex-none w-full">
                    <img src="https://images.pexels.com/photos/1287145/pexels-photo-1287145.jpeg" alt="Imagen 3" class="w-full h-full object-cover">
                </div>
                <!-- Slide 4 -->
                <div class="flex-none w-full">
                    <img src="https://images.pexels.com/photos/2559941/pexels-photo-2559941.jpeg" alt="Imagen 4" class="w-full h-full object-cover">
                </div>
            </div>
            
            <!-- Botones de navegación con Google Material Icons -->
            <button id="prev-button" class="absolute top-1/2 left-0 -translate-y-1/2 bg-black/50 text-white p-2 rounded-r-lg hover:bg-black/75 transition-colors duration-300 flex items-center justify-center focus:outline-none">
                <i class="material-icons text-[28px]">navigate_before</i>
            </button>
            <button id="next-button" class="absolute top-1/2 right-0 -translate-y-1/2 bg-black/50 text-white p-2 rounded-l-lg hover:bg-black/75 transition-colors duration-300 flex items-center justify-center focus:outline-none">
                <i class="material-icons text-[28px]">navigate_next</i>
            </button>
            
            <!-- Indicador de progreso -->
        </div>
        <div id="carousel-progress">
            <!-- Los indicadores se generarán dinámicamente con JavaScript -->
        </div>
    </div>
    
    <!-- Script del carrusel -->
    <script src="carousel.js"></script>
</body>
</html>
